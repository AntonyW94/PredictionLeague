<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Meta Tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>The Predictions - The Ultimate Football Prediction Game</title>
    <base href="/" />

    <!-- Social Media Meta Tags -->
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://www.thepredictions.co.uk/">
    <meta property="og:title" content="The Predictions - The Ultimate Football Prediction Game">
    <meta property="og:description" content="Challenge your friends, prove your football knowledge, and top the leaderboard. Your journey to prediction glory starts here.">
    <meta property="og:image" content="https://www.thepredictions.co.uk/images/brand/social-card.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="The Predictions - The Ultimate Football Prediction Game">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://www.thepredictions.co.uk/">
    <meta property="twitter:title" content="The Predictions - The Ultimate Football Prediction Game">
    <meta property="twitter:description" content="Challenge your friends, prove your football knowledge, and top the leaderboard. Your journey to prediction glory starts here.">
    <meta property="twitter:image" content="https://www.thepredictions.co.uk/images/brand/social-card.png">
    <meta property="twitter:image:alt" content="The Predictions - The Ultimate Football Prediction Game">

    <!-- Stylesheets -->
    <!-- Self-hosted vendor CSS. Served from our own origin so the Content-Security-Policy needs no
         third-party style-src, and so the site is not styled by whatever a CDN happens to serve.
         Versions are pinned in the file paths' source: Bootstrap 5.3.3, Bootstrap Icons 1.11.3,
         SweetAlert2 11.26.25. Deliberately not part of the css/app.css bundle - bootstrap-icons.min.css
         references its webfont with a relative url(), which bundling to a different depth would break. -->
    <link rel="stylesheet" href="lib/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css">
    <link rel="stylesheet" href="lib/sweetalert2/sweetalert2.min.css">
    <link rel="stylesheet" href="css/app.css" />

    <!-- Favicons -->
    <link rel="icon" href="favicon.ico?v=2" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="images/icons/favicon-32.png?v=2">
    <link rel="icon" type="image/png" sizes="16x16" href="images/icons/favicon-16.png?v=2">
    <link rel="apple-touch-icon" sizes="180x180" href="images/icons/apple-touch-icon.png?v=2">
</head>

<body>
    <div id="app">
        <div class="app-loading-container">
            <div class="spinner"></div>
            <p>Loading The Predictions...</p>
        </div>
    </div>

    <script src="js/loading-theme.js"></script>

    <div id="blazor-error-ui">
        <span id="blazor-error-message">An unhandled error has occurred.</span>
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <script src="js/error-handlers.js"></script>

    <!-- Javascript Files -->
    <!-- ?v bumped when interop.js changes so browsers fetch the new file instead of a cached copy -->
    <script src="js/interop.js?v=2"></script>
    <script src="_framework/blazor.webassembly.js"></script>
    <script src="lib/bootstrap/bootstrap.bundle.min.js"></script>
    <script src="lib/sweetalert2/sweetalert2.all.min.js"></script>
</body>
</html>
