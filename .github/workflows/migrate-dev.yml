# Standalone wrapper: migrate the Dev database without a code deploy. Manual trigger only.
# Low-risk (dev), so no confirmation gate. See ADR-0013.
name: Migrate Dev database

on:
  workflow_dispatch:

jobs:
  migrate:
    uses: ./.github/workflows/migrate-shared.yml
    with:
      environment: dev
    secrets:
      MIGRATE_CONNECTION_STRING: ${{ secrets.DEV_CONNECTION_STRING }}

  notify:
    # Not always(): a cancelled run notifies nothing at all. See notify-slack.yml.
    if: ${{ !cancelled() }}
    needs: [migrate]
    uses: ./.github/workflows/notify-slack.yml
    with:
      status: ${{ contains(needs.*.result, 'failure') && 'failure' || 'success' }}
      notify-on: always
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
