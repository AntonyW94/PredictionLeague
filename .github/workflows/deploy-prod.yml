# .github/workflows/deploy-prod.yml
name: Deploy to Prod

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm deployment'
        required: true
        type: string

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate confirmation
        if: github.event.inputs.confirm != 'deploy'
        run: |
          echo "Deployment cancelled. You must type 'deploy' to confirm."
          exit 1

  # Apply pending database migrations before deploying new code (schema lands first).
  migrate:
    needs: validate
    uses: ./.github/workflows/migrate-shared.yml
    with:
      environment: prod
    secrets:
      MIGRATE_CONNECTION_STRING: ${{ secrets.PROD_CONNECTION_STRING }}

  deploy:
    needs: migrate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore dependencies
        run: dotnet restore ThePredictions.sln

      - name: Build solution
        run: dotnet build ThePredictions.sln --no-restore --configuration Release /p:TreatWarningsAsErrors=true

      # Category!=E2E excludes the browser smoke suite. It targets deployed dev and the accounts that
      # only exist there, so it has nothing to say about a production deploy. Stage 1 is dev-only.
      - name: Run all tests
        run: dotnet test ThePredictions.sln --no-build --configuration Release --verbosity normal --filter "Category!=E2E"

      - name: Publish Web application
        run: |
          dotnet publish src/ThePredictions.Web/ThePredictions.Web.csproj \
            --configuration Release \
            --output ./publish \
            --no-build \
            -p:PublishProfile=Production

      - name: Write appsettings secrets
        run: echo '${{ secrets.PROD_APPSETTINGS_SECRETS }}' > ./publish/appsettings.Production.Secrets.json

      - name: Clean unnecessary files from publish
        run: |
          rm -rf ./publish/BlazorDebugProxy
          find ./publish -name "*.pdb" -delete

      - name: Deploy to prod site via FTP
        run: |
          sudo apt-get install -y -qq lftp > /dev/null 2>&1
          lftp -u "${{ secrets.PROD_FTP_USERNAME }},${{ secrets.PROD_FTP_PASSWORD }}" \
            "ftp://${{ vars.FTP_SERVER }}" \
            -e "set ftp:passive-mode yes; \
                set ftp:ssl-allow no; \
                set ftp:chmod no; \
                set mirror:parallel-directories yes; \
                echo 'Pass 1: Uploading new and changed files...'; \
                mirror --reverse --exclude logs/ --exclude ShadowCopyDirectory/ --exclude keys/ --parallel=10 --verbose ./publish/ /htdocs/; \
                echo 'Pass 2: Removing stale files...'; \
                mirror --reverse --delete --exclude logs/ --exclude ShadowCopyDirectory/ --exclude keys/ --parallel=10 --verbose ./publish/ /htdocs/; \
                quit"

      - name: Verify deployment file count
        run: |
          LOCAL_COUNT=$(find ./publish -type f | wc -l)
          echo "Local files: $LOCAL_COUNT"

          # The recursive FTP listing is flaky on this host: with no timeout/retry settings a single
          # stalled LIST silently truncates the result, so a one-shot count can come back far too low
          # and fail a perfectly good deploy. The mirror step above is the reliable transfer (and its
          # --delete pass removes stale files); this is a missing-files sanity check only. Give lftp
          # generous timeouts/retries, prefer MLSD, take the best (highest) count across a few
          # attempts, and fail only if the best attempt is still short of the local count.
          BEST_REMOTE=0
          for attempt in 1 2 3; do
            REMOTE_COUNT=$(lftp -u "${{ secrets.PROD_FTP_USERNAME }},${{ secrets.PROD_FTP_PASSWORD }}" \
              "ftp://${{ vars.FTP_SERVER }}" \
              -e "set net:timeout 30; \
                  set net:max-retries 3; \
                  set net:reconnect-interval-base 5; \
                  set ftp:passive-mode yes; \
                  set ftp:ssl-allow no; \
                  set ftp:use-mlsd yes; \
                  find /htdocs/; \
                  quit" | grep -v '/$' | grep -v '/logs/' | grep -v '/ShadowCopyDirectory/' | grep -v '/keys/' | wc -l)
            echo "Attempt $attempt remote files: $REMOTE_COUNT"
            if [ "$REMOTE_COUNT" -gt "$BEST_REMOTE" ]; then
              BEST_REMOTE=$REMOTE_COUNT
            fi
            if [ "$BEST_REMOTE" -ge "$LOCAL_COUNT" ]; then
              break
            fi
            sleep 5
          done

          echo "Remote files (best of attempts): $BEST_REMOTE"
          if [ "$BEST_REMOTE" -lt "$LOCAL_COUNT" ]; then
            echo "ERROR: File count short! Expected at least $LOCAL_COUNT but found only $BEST_REMOTE on server after retries."
            exit 1
          fi
          echo "File count verified ($BEST_REMOTE >= $LOCAL_COUNT)."

      - name: Warm up site
        run: |
          echo "Warming up site to avoid cold-start delay..."
          # -L follows the apex -> www 301 redirect so we report the final 200, not the redirect.
          HTTP_STATUS=$(curl -L --retry 5 --retry-delay 10 --retry-all-errors \
            --max-time 120 -o /dev/null -s -w "%{http_code}" \
            "https://thepredictions.co.uk" || true)
          echo "HTTP status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "Site is up."
            exit 0
          fi
          echo "Site returned $HTTP_STATUS - forcing app pool recycle via web.config touch..."
          echo "" >> ./publish/web.config
          lftp -u "${{ secrets.PROD_FTP_USERNAME }},${{ secrets.PROD_FTP_PASSWORD }}" \
            "ftp://${{ vars.FTP_SERVER }}" \
            -e "set ftp:passive-mode yes; \
                set ftp:ssl-allow no; \
                put ./publish/web.config -o /htdocs/web.config; \
                quit"
          echo "Waiting for app pool to recycle..."
          sleep 15
          echo "Retrying warm up..."
          curl -L --retry 5 --retry-delay 10 --retry-all-errors \
            --max-time 120 -o /dev/null -s -w "HTTP %{http_code} in %{time_total}s\n" \
            "https://thepredictions.co.uk"

      - name: Deployment complete
        run: |
          echo "Deployment to production complete!"
          echo "Site: https://thepredictions.co.uk"

  # Reports the overall outcome to #github. Runs even when an earlier job fails, so a
  # failed migration is still reported rather than silently skipping the notification.
  notify:
    if: always()
    needs: [validate, migrate, deploy]
    uses: ./.github/workflows/notify-slack.yml
    with:
      status: ${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && 'failure' || 'success' }}
      notify-on: always
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
