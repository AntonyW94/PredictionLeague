name: Refresh Dev Database

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "refresh" to confirm database refresh'
        required: true
        type: string
      keep_league_names:
        description: 'Keep real league names (do not anonymise them)'
        required: false
        type: boolean
        default: true
      preserve_first_names:
        description: 'Preserve real first names (only anonymise last names)'
        required: false
        type: boolean
        default: false

jobs:
  # Migrate the dev schema before copying production data into it.
  migrate:
    if: github.event.inputs.confirm == 'refresh'
    uses: ./.github/workflows/migrate-shared.yml
    with:
      environment: dev
    secrets:
      MIGRATE_CONNECTION_STRING: ${{ secrets.DEV_CONNECTION_STRING }}

  refresh:
    needs: migrate
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'refresh'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Restore tool dependencies
        run: dotnet restore tools/ThePredictions.DatabaseTools/ThePredictions.DatabaseTools.csproj

      - name: Build refresh tool
        run: dotnet build tools/ThePredictions.DatabaseTools/ThePredictions.DatabaseTools.csproj --configuration Release

      - name: Run Database Refresh
        run: dotnet run --project tools/ThePredictions.DatabaseTools --configuration Release -- DevelopmentRefresh
        env:
          PROD_CONNECTION_STRING: ${{ secrets.PROD_CONNECTION_STRING }}
          DEV_CONNECTION_STRING: ${{ secrets.DEV_CONNECTION_STRING }}
          TEST_ACCOUNT_PASSWORD: ${{ secrets.TEST_ACCOUNT_PASSWORD }}
          KEEP_LEAGUE_NAMES: ${{ inputs.keep_league_names }}
          PRESERVE_FIRST_NAMES: ${{ inputs.preserve_first_names }}

      - name: Report Success
        if: success()
        run: |
          echo "Dev database refreshed successfully!"
          echo ""
          echo "Test accounts created:"
          echo "  testplayer@dev.local / [password in secrets]"
          echo "  testadmin@dev.local / [password in secrets]"

  notify:
    if: always()
    needs: [migrate, refresh]
    uses: ./.github/workflows/notify-slack.yml
    with:
      status: ${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && 'failure' || 'success' }}
      notify-on: always
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
