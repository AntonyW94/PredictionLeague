name: Backup Production Database

on:
  schedule:
    - cron: '0 2 * * *' # Daily at 2am UTC
  workflow_dispatch:

jobs:
  # Migrate the backup schema before copying production data into it.
  migrate:
    uses: ./.github/workflows/migrate-shared.yml
    with:
      environment: backup
    secrets:
      MIGRATE_CONNECTION_STRING: ${{ secrets.BACKUP_CONNECTION_STRING }}

  backup:
    needs: migrate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Restore tool dependencies
        run: dotnet restore tools/ThePredictions.DatabaseTools/ThePredictions.DatabaseTools.csproj

      - name: Build backup tool
        run: dotnet build tools/ThePredictions.DatabaseTools/ThePredictions.DatabaseTools.csproj --configuration Release

      - name: Run Production Backup
        run: dotnet run --project tools/ThePredictions.DatabaseTools --configuration Release -- ProductionBackup
        env:
          PROD_CONNECTION_STRING: ${{ secrets.PROD_CONNECTION_STRING }}
          BACKUP_CONNECTION_STRING: ${{ secrets.BACKUP_CONNECTION_STRING }}

      - name: Report Success
        if: success()
        run: echo "Production database backed up successfully!"

  # Failures only: this runs daily on a schedule, so a success message every morning
  # would be noise that trains you to ignore the channel.
  notify:
    if: always()
    needs: [migrate, backup]
    uses: ./.github/workflows/notify-slack.yml
    with:
      status: ${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && 'failure' || 'success' }}
      notify-on: failure
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
