name: Notify Slack (shared)

# Posts a one-line outcome to the #github Slack channel via an incoming webhook.
#
# Called via `workflow_call` from the TOP-LEVEL workflows only. Deliberately never called
# from migrate-shared.yml: that has seven callers, so notifying there would post a second
# message every time a deploy, backup or refresh ran its migration step.
#
# SLACK_WEBHOOK_URL is optional on purpose. If it is not set the notification is skipped
# with a log line instead of failing the run, so this can be merged and live in the repo
# before the secret exists.
#
# A CANCELLED RUN NOTIFIES NOTHING. Every caller guards this job with `if: ${{ !cancelled() }}`
# rather than `always()`, so a cancelled run posts no message at all. `!cancelled()` still runs
# the job when a needed job FAILED, which is what `always()` was there for, so a real failure is
# still reported.
#
# The guard has to live in the caller, and dropping `cancelled` from its `status` expression is
# NOT a substitute. Six callers pass `notify-on: always`, where the condition below posts
# whatever the status is - so a cancelled deploy or migration would announce itself as a
# SUCCESS, which is worse than the false failure this replaced. The job must not run at all.

on:
  workflow_call:
    inputs:
      status:
        description: 'Overall outcome of the calling workflow: success or failure.'
        required: true
        type: string
      notify-on:
        description: 'always (post success and failure) or failure (post failures only).'
        required: false
        default: always
        type: string
    secrets:
      SLACK_WEBHOOK_URL:
        required: false

jobs:
  notify:
    if: inputs.notify-on == 'always' || inputs.status == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Post outcome to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          STATUS: ${{ inputs.status }}
          WORKFLOW: ${{ github.workflow }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail

          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "SLACK_WEBHOOK_URL is not set - skipping the Slack notification."
            exit 0
          fi

          if [ "${STATUS}" = "success" ]; then
            icon=":white_check_mark:"
            colour="#00B960"
            outcome="succeeded"
          else
            icon=":x:"
            colour="#E90052"
            outcome="failed"
          fi

          # Slack builds desktop and mobile notification previews from the TOP-LEVEL text
          # field. A payload made only of blocks or attachments gives it nothing to preview,
          # which shows up as "No preview available" on the push notification. So the headline
          # goes in text (previewable, and also the accessibility fallback), and the run link
          # sits in the coloured attachment below it. fallback covers older clients that do
          # not render blocks at all.
          headline="${icon} *${WORKFLOW}* ${outcome} on \`${REF_NAME}\`"
          detail="<${RUN_URL}|Run #${RUN_NUMBER}> - ${ACTOR}"

          payload=$(jq -n \
            --arg colour "${colour}" \
            --arg headline "${headline}" \
            --arg detail "${detail}" \
            '{
               text: $headline,
               attachments: [{
                 color: $colour,
                 fallback: $headline,
                 blocks: [{type: "section", text: {type: "mrkdwn", text: $detail}}]
               }]
             }')

          http=$(curl -sS -o /tmp/slack-response.txt -w '%{http_code}' \
            -X POST -H 'Content-type: application/json' \
            --data "${payload}" "${SLACK_WEBHOOK_URL}")

          if [ "${http}" != "200" ]; then
            echo "Slack webhook returned HTTP ${http}:"
            cat /tmp/slack-response.txt
            exit 1
          fi

          echo "Posted ${STATUS} notification for ${WORKFLOW}."
